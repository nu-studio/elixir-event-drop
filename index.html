<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Elixir Event Drop</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Elixir Drop">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion app: quiet, premium, almost monochrome, fast to use
   IDEA   a wedding stationery card turned into a phone app: the Elixir ornament in ink, generous air
   PICTURE the black drop card with the ornament: the one big action, then live order cards
   COLOUR white / near-black ink, warm rosewood accent for progress, soft warm grey surfaces
   TYPE   Manrope 800 for UI titles, Cormorant Garamond only for the brand line
   LAYOUT one centred phone column (max 560px), sticky top bar, bottom tab bar, bottom sheet for a new drop */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0b0b0c);--ink:light-dark(#111113,#f3f1ee);--mute:light-dark(#6c6b70,#a3a09c);--line:light-dark(#ebe9e6,#242326);--soft:light-dark(#f5f3f0,#161518);--card:light-dark(#ffffff,#121214);--hero:light-dark(#111113,#1c1b1f);--acc:light-dark(#a8745c,#dba68c);--ok:light-dark(#1d7a4c,#63d39c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:16px/1.5 Manrope,system-ui,-apple-system,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
img{max-width:100%}
.shell{max-width:560px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left)) calc(110px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.icon{width:36px;height:36px;flex:none;border-radius:10px;background:var(--hero);color:#f6f2ec;display:grid;place-items:center;font:600 22px/1 "Cormorant Garamond",Georgia,serif;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.icon.big{width:84px;height:84px;border-radius:22px;font-size:52px;margin:0 auto 18px}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em}
.role{font-size:13px;font-weight:600;color:var(--mute)}
h1{font-size:clamp(30px,8vw,38px);line-height:1.05;letter-spacing:-.025em;margin:18px 0 6px;font-weight:800;text-wrap:balance}
.sub{color:var(--mute);margin:0 0 20px}
h2{font-size:20px;letter-spacing:-.015em;margin:30px 0 12px;font-weight:800;display:flex;align-items:baseline;gap:8px}
h2 small{font-size:14px;color:var(--mute);font-weight:600}
.hero{position:relative;overflow:hidden;border-radius:28px;background:var(--hero);color:#f6f2ec;padding:28px 24px 24px;min-height:250px;display:flex;flex-direction:column;justify-content:flex-end}
.hero h3{position:relative;display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:clamp(26px,7.4vw,32px);line-height:1.05;letter-spacing:-.02em;margin:0 0 10px;font-weight:800}
.hero h3 svg{width:34px;height:20px;flex:none;color:var(--acc)}
.hero p{position:relative;margin:0 0 20px;color:#cfc8bf;max-width:30ch}
.btn{appearance:none;border:0;border-radius:99px;min-height:50px;padding:0 22px;font-weight:700;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.tab:focus-visible,.seg label:focus-within,.drop:focus-within{outline:2px solid var(--acc);outline-offset:3px}
.light{background:#f6f2ec;color:#111113;width:100%}
.dark{background:var(--ink);color:var(--bg)}
.ghost{background:var(--soft);color:var(--ink)}
.small{min-height:44px;font-size:15px;padding:0 16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.list{display:grid;gap:12px}
.card{border:1px solid var(--line);background:var(--card);border-radius:22px;padding:16px}
.row{display:flex;gap:14px;align-items:center}
.stack{position:relative;width:64px;height:64px;flex:none}
.stack img,.stack i{position:absolute;width:52px;height:52px;border-radius:14px;object-fit:cover;border:2px solid var(--card);background:var(--soft)}
.stack :nth-child(1){left:0;top:12px;z-index:3}.stack :nth-child(2){left:8px;top:6px;z-index:2;opacity:.85}.stack :nth-child(3){left:14px;top:0;z-index:1;opacity:.65}
.ttl{font-weight:800;font-size:17px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--mute);font-size:14px}
.chip{margin-left:auto;flex:none;font-size:13px;font-weight:700;padding:6px 10px;border-radius:99px;background:var(--soft);white-space:nowrap}
.chip.prod{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.chip.livre{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.bar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:14px 0 8px}
.bar i{height:5px;border-radius:9px;background:var(--line)}
.bar i.on{background:var(--acc)}.bar.done i{background:var(--ok)}
.steps{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}
.steps .on{color:var(--ink);font-weight:700}
video{display:block;width:100%;border-radius:16px;background:#000;margin:14px 0 12px;max-height:70vh}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.acts .btn{flex:1 1 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:6px;margin-top:12px}
.grid img{aspect-ratio:1;width:100%;object-fit:cover;border-radius:10px;background:var(--soft)}
.note{margin-top:10px;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.empty{text-align:center;color:var(--mute);padding:34px 18px;border:1px dashed var(--line);border-radius:22px}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.banner{font-size:14px;background:var(--soft);border-radius:16px;padding:12px 14px;margin:6px 0 14px;color:var(--mute)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;min-height:48px;padding:0 18px;border-radius:99px;font-weight:700;font-size:15px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:7px}
.tab svg{width:20px;height:20px}
.tab[aria-current=true]{background:var(--ink);color:var(--bg)}
.sheet{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.panel{position:relative;width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media(prefers-reduced-motion:reduce){.panel{animation:none}.btn{transition:none}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.panel h3{font-size:24px;letter-spacing:-.02em;margin:6px 0 16px;font-weight:800;display:flex;align-items:center}
.x{margin-left:auto;width:44px;height:44px;border-radius:99px;border:0;background:var(--soft);cursor:pointer;font-size:20px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:130px;border:1.5px dashed color-mix(in srgb,var(--ink) 30%,transparent);border-radius:20px;background:var(--soft);cursor:pointer;text-align:center;padding:16px}
.drop b{font-size:17px}.drop span{color:var(--mute);font-size:14px}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.pv{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px;margin:10px 0 0}
.pv div{position:relative}
.pv img{aspect-ratio:1;width:100%;object-fit:cover;border-radius:12px;display:block}
.pv button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:99px;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.fld{display:block;margin-top:18px}
.fld>span{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.fld input,.fld textarea{width:100%;font-size:16px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:13px 14px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld textarea:focus{outline:2px solid var(--acc);outline-offset:1px;border-color:transparent}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg label{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border:1px solid var(--line);border-radius:14px;cursor:pointer;font-weight:700;font-size:14px;text-align:center}
.seg input{position:absolute;opacity:0}
.seg label:has(input:checked){border-color:var(--ink);background:var(--soft)}
.seg i{display:block;border:2px solid currentColor;border-radius:4px}
.prog{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:18px 0 6px}
.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.err{color:#c4372b;font-size:14px;min-height:20px;margin:6px 0}
.submit{width:100%;margin-top:6px}
.gate{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px max(20px,env(safe-area-inset-left)) calc(24px + env(safe-area-inset-bottom))}
.gate[hidden]{display:none}
.splash{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;align-items:center;justify-content:center;transition:opacity .25s}
.splash .icon{margin:0}
.splash.off{opacity:0;pointer-events:none}
@media(prefers-reduced-motion:reduce){.splash{transition:none}}
.gate form{width:100%;max-width:380px;text-align:center}
.gate h1{margin:0 0 6px}
.gate .fld{text-align:left}
.fld[hidden]{display:none}
.gate .btn{width:100%;margin-top:14px}
.gate .foot{margin-top:22px;font-size:13px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:99px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
.del{width:100%;margin-top:8px;background:none;color:#c4372b;font-weight:600}
.del.arm{background:color-mix(in srgb,#c4372b 12%,transparent)}
.out{margin-left:auto;appearance:none;border:0;background:var(--soft);min-height:36px;padding:0 14px;border-radius:99px;font-weight:600;font-size:13px;color:var(--mute);cursor:pointer}
.who{font-size:13px;color:var(--mute);margin-top:2px}
.ph-x{display:block;aspect-ratio:1;border-radius:10px;background:var(--soft)}
.vidin{position:relative;overflow:hidden}
.vidin input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style></head>
<body>
<div class="shell">
  <header class="top">
    <div class="icon" aria-hidden="true">E</div>
    <div class="brand" id="appname">Elixir Event Drop</div>
    <button class="out" id="out" type="button" hidden>Se déconnecter</button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs" aria-label="Navigation" hidden></nav>

<div class="sheet" id="sheet" hidden>
  <div class="scrim" data-close></div>
  <form class="panel" id="form" novalidate>
    <div class="grab"></div>
    <h3>Nouveau dépôt <button type="button" class="x" data-close aria-label="Fermer">×</button></h3>
    <label class="drop" for="photos">
      <input type="file" id="photos" accept="image/*" multiple>
      <b>Choisir les photos</b>
      <span>Depuis votre galerie, autant que vous voulez</span>
    </label>
    <div class="pv" id="pv"></div>
    <label class="fld"><span>Nom de l'événement</span><input id="title" type="text" placeholder="Mariage Claire &amp; Hugo" autocomplete="off"></label>
    <div class="fld"><span>Format de la vidéo</span>
      <div class="seg" role="radiogroup">
        <label><input type="radio" name="fmt" id="f-reel" value="reel" checked><i style="width:14px;height:24px"></i>Reel 9:16</label>
        <label><input type="radio" name="fmt" id="f-carre" value="carre"><i style="width:20px;height:20px"></i>Carré 1:1</label>
        <label><input type="radio" name="fmt" id="f-pays" value="paysage"><i style="width:28px;height:16px"></i>Paysage 16:9</label>
      </div>
    </div>
    <label class="fld"><span>Note pour le studio <span style="color:var(--mute);font-weight:500">(facultatif)</span></span><textarea id="note" placeholder="Ambiance, musique, moments à mettre en avant…"></textarea></label>
    <div class="prog" id="prog" hidden><i></i></div>
    <div class="err" id="err" role="status"></div>
    <button class="btn dark submit" id="send" type="submit">Envoyer les photos</button>
  </form>
</div>

<div class="splash" id="splash" aria-hidden="true"><div class="icon big">E</div></div>

<div class="gate" id="gate" hidden>
  <form id="login" novalidate>
    <div class="icon big" aria-hidden="true">E</div>
    <h1 id="hello">Bonjour</h1>
    <p class="sub" id="gsub">Connectez-vous à votre espace.</p>
    <label class="fld" id="emailf" hidden><span>E-mail</span><input id="email" type="email" autocomplete="username" inputmode="email" placeholder="vous@exemple.fr"></label>
    <label class="fld"><span id="passl">Code d'accès</span><input id="pass" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Votre code"></label>
    <div class="err" id="lerr" role="status"></div>
    <button class="btn dark" id="lbtn" type="submit">Se connecter</button>
    <p class="foot">nu studio · Paris</p>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
{
const C = window.DROP_CONFIG || {};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST = {recu:'Reçu', prod:'En création', livre:'Livrée'};
const STEP = {recu:0, prod:1, livre:2};
const FMT = {reel:'Reel 9:16', carre:'Carré 1:1', paysage:'Paysage 16:9'};
const HOUR = 3600e3;
const BUCKET = 'drop';
const ts = v => new Date(v).getTime();
const hm = t => new Date(t).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'});
const day = t => { const d = new Date(t); return d.toDateString() === new Date().toDateString() ? "Aujourd'hui" : d.toLocaleDateString('fr-FR', {day:'numeric', month:'short'}); };
const slug = s => (s || 'video-elixir').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]+/g, '-').replace(/^-|-$/g, '').toLowerCase() || 'video-elixir';
const ICON = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>',
  vid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>',
  studio:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h13"/></svg>'
};

const configured = window.supabase && C.SUPABASE_URL && !/VOTRE-PROJET/.test(C.SUPABASE_URL) && C.SUPABASE_ANON_KEY && !/COLLEZ-ICI/.test(C.SUPABASE_ANON_KEY);
const sb = configured ? window.supabase.createClient(C.SUPABASE_URL, C.SUPABASE_ANON_KEY) : null;

let me = null, owner = false, orders = [], urls = {}, tab = 'home', picked = [], busy = false, loaded = false, chan = null, poll = null;
const ready = {};   // video path -> Blob prête à partager

$('#appname').textContent = C.APP_NAME || 'Elixir Event Drop';
$('#hello').textContent = C.CLIENT_NAME ? `Bonjour ${C.CLIENT_NAME}` : 'Bonjour';
$('#gsub').textContent = 'Entrez votre code pour accéder à votre espace.';
const studioLogin = location.hash === '#studio';
if (studioLogin){ $('#emailf').hidden = false; $('#passl').textContent = 'Mot de passe'; $('#hello').textContent = 'Studio'; $('#gsub').textContent = 'Connexion nu studio.'; }
if (!sb) $('#lerr').textContent = 'App pas encore configurée : remplissez config.js.';

function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.k); toast.k = setTimeout(() => t.hidden = true, 3400); }
const src = p => urls[p] || '';

/* ---------- rendu ---------- */
function thumbs(o){
  const ph = (o.photos || []).slice(0, 3);
  return `<div class="stack">${ph.length ? ph.map(p => src(p) ? `<img src="${esc(src(p))}" alt="" loading="lazy">` : '<i></i>').join('') : '<i></i>'}</div>`;
}
function progress(o){
  const s = STEP[o.status] ?? 0;
  return `<div class="bar ${o.status === 'livre' ? 'done' : ''}">${[0,1,2].map(i => `<i class="${i <= s ? 'on' : ''}"></i>`).join('')}</div>
  <div class="steps">${['Reçu','En création','Livrée'].map((l, i) => `<span class="${i === s ? 'on' : ''}">${l}</span>`).join('')}</div>`;
}
function card(o, studio){
  const n = (o.photos || []).length;
  const when = o.status === 'livre' && o.delivered_at ? `Livrée à ${hm(o.delivered_at)}` : `Prête vers ${hm(ts(o.created_at) + HOUR)}`;
  let b = `<div class="row">${thumbs(o)}<div style="flex:1"><div class="ttl">${esc(o.title || 'Sans titre')}</div>
    <div class="meta">${day(o.created_at)} · ${n} photo${n > 1 ? 's' : ''} · ${esc(FMT[o.format] || '')}</div>
    ${studio && o.client_email ? `<div class="who">${esc(o.client_email)}</div>` : ''}</div>
    <span class="chip ${esc(o.status)}">${esc(ST[o.status] || '')}</span></div>`;
  b += progress(o);
  if (o.status !== 'livre') b += `<div class="meta" style="margin-top:8px">${when}</div>`;
  if (o.status === 'livre' && o.video){
    const name = `${slug(o.title)}.${(o.video.split('.').pop() || 'mp4').toLowerCase()}`;
    b += `<video src="${esc(src(o.video))}" controls playsinline preload="metadata"></video>
      <button class="btn dark small" style="width:100%" data-dl="${esc(o.video)}" data-name="${esc(name)}">${ready[o.video] ? 'Enregistrer sur mon téléphone' : 'Télécharger la vidéo'}</button>
      <div class="meta" style="margin-top:8px;text-align:center">${when}</div>`;
  }
  if (studio){
    if (o.note) b += `<div class="note">${esc(o.note)}</div>`;
    if (n) b += `<div class="grid">${o.photos.map((p, i) => src(p) ? `<img src="${esc(src(p))}" alt="Photo ${i + 1}" loading="lazy">` : '<span class="ph-x"></span>').join('')}</div>`;
    b += `<div class="acts">
      ${n ? `<button class="btn ghost small" data-dlall="${esc(o.id)}">Récupérer les photos</button>` : ''}
      ${o.status === 'recu' ? `<button class="btn ghost small" data-start="${esc(o.id)}">Lancer la création</button>` : ''}
      <label class="btn dark small vidin">${o.status === 'livre' ? 'Remplacer la vidéo' : 'Livrer la vidéo'}<input type="file" accept="video/*" data-vid="${esc(o.id)}" aria-label="Choisir la vidéo"></label>
    </div>
    <button class="btn small del" data-del="${esc(o.id)}">Supprimer la commande</button>`;
  }
  return `<article class="card">${b}</article>`;
}
function hero(){
  return `<section class="hero">
    <h3>Vos photos <svg viewBox="0 0 34 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 10h29M23 3l8 7-8 7"/></svg> Votre film</h3>
    <p>Déposez les photos de l'événement, nous livrons la vidéo ici.</p>
    <button class="btn light" data-new>Déposer des photos</button>
  </section>`;
}
const empty = (t, s) => `<div class="empty"><b>${t}</b>${s}</div>`;
const firstName = () => (me && me.user_metadata && me.user_metadata.name) || C.CLIENT_NAME || '';

function render(){
  if (!me) return;
  const v = $('#view');
  const live = orders.filter(o => o.status !== 'livre');
  const done = orders.filter(o => o.status === 'livre');
  const wait = loaded ? '' : '<div class="banner">Chargement…</div>';
  if (tab === 'home'){
    v.innerHTML = `<h1>Bonjour${firstName() ? ' ' + esc(firstName()) : ''}</h1><p class="sub">Elixir Event × nu studio</p>${wait}${hero()}
      <h2>En cours ${live.length ? `<small>${live.length}</small>` : ''}</h2>
      <div class="list">${live.length ? live.map(o => card(o, false)).join('') : empty('Aucune vidéo en préparation', 'Vos prochains dépôts apparaîtront ici.')}</div>
      ${done.length ? `<h2>Dernière vidéo</h2><div class="list">${card(done[0], false)}</div>` : ''}`;
  } else if (tab === 'videos'){
    v.innerHTML = `<h1>Mes vidéos</h1><p class="sub">${done.length} vidéo${done.length > 1 ? 's' : ''} livrée${done.length > 1 ? 's' : ''}</p>${wait}
      <div class="list">${done.length ? done.map(o => card(o, false)).join('') : empty('Pas encore de vidéo', 'Dès qu\'une vidéo est prête, vous la retrouvez ici pour la télécharger.')}</div>`;
  } else {
    const groups = [['recu', 'À traiter'], ['prod', 'En création'], ['livre', 'Livrées']];
    v.innerHTML = `<h1>Studio</h1><p class="sub">${live.length} commande${live.length > 1 ? 's' : ''} en attente</p>${wait}
      ${groups.map(([k, l]) => { const g = orders.filter(o => o.status === k); return `<h2>${l} <small>${g.length}</small></h2><div class="list">${g.length ? g.map(o => card(o, true)).join('') : empty('Rien ici', '')}</div>`; }).join('')}`;
  }
  const t = owner ? [['studio', 'Studio'], ['home', 'Accueil'], ['videos', 'Vidéos']] : [['home', 'Accueil'], ['videos', 'Mes vidéos']];
  $('#tabs').innerHTML = t.map(([k, l]) => `<button class="tab" data-tab="${k}" aria-current="${tab === k}">${ICON[k === 'videos' ? 'vid' : k]}${l}</button>`).join('');
}

/* ---------- données ---------- */
async function load(){
  const {data, error} = await sb.from('orders').select('*').order('created_at', {ascending: false});
  if (error){ if (!loaded) toast('Impossible de charger les commandes.'); return; }
  orders = data || [];
  const need = [...new Set(orders.flatMap(o => [...(o.photos || []), o.video].filter(Boolean)))].filter(p => !urls[p]);
  for (let i = 0; i < need.length; i += 100){
    const {data: s} = await sb.storage.from(BUCKET).createSignedUrls(need.slice(i, i + 100), 60 * 60 * 12);
    (s || []).forEach(x => { if (x.signedUrl && x.path) urls[x.path] = x.signedUrl; });
  }
  loaded = true; render();
}

async function enter(session){
  me = session.user;
  const {data} = await sb.from('admins').select('user_id').limit(1);
  owner = !!(data && data.length);
  tab = owner ? 'studio' : 'home';
  $('#gate').hidden = true; $('#tabs').hidden = false; $('#out').hidden = false;
  await load();
  if (!chan) chan = sb.channel('orders-live').on('postgres_changes', {event: '*', schema: 'public', table: 'orders'}, () => load()).subscribe();
  clearInterval(poll); poll = setInterval(() => { if (document.visibilityState === 'visible') load(); }, 30000);
}
function leave(){
  me = null; owner = false; orders = []; urls = {}; loaded = false;
  if (chan){ sb.removeChannel(chan); chan = null; }
  clearInterval(poll);
  $('#view').innerHTML = ''; $('#tabs').hidden = true; $('#out').hidden = true; $('#gate').hidden = false;
}

/* ---------- connexion ---------- */
$('#login').addEventListener('submit', async e => {
  e.preventDefault();
  if (!sb) return;
  const email = studioLogin ? $('#email').value.trim() : (C.CLIENT_EMAIL || ''), password = $('#pass').value.trim();
  if (!email || !password){ $('#lerr').textContent = studioLogin ? 'Entrez votre e-mail et votre mot de passe.' : 'Entrez votre code d\'accès.'; return; }
  $('#lbtn').disabled = true; $('#lerr').textContent = '';
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  $('#lbtn').disabled = false;
  if (error){ $('#lerr').textContent = studioLogin ? 'E-mail ou mot de passe incorrect.' : 'Code incorrect.'; return; }
  $('#pass').value = '';
  await enter(data.session);
});
$('#out').addEventListener('click', async () => { await sb.auth.signOut(); leave(); });

/* ---------- nouveau dépôt ---------- */
function openSheet(){ $('#sheet').hidden = false; $('#err').textContent = ''; }
function closeSheet(){ if (busy) return; $('#sheet').hidden = true; }
function drawPicked(){
  $('#pv').innerHTML = picked.map((p, i) => `<div><img src="${p.url}" alt=""><button type="button" data-rm="${i}" aria-label="Retirer">×</button></div>`).join('');
  $('#send').textContent = picked.length ? `Envoyer ${picked.length} photo${picked.length > 1 ? 's' : ''}` : 'Envoyer les photos';
}
const OK = {'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp'};
async function prep(file){
  if (OK[file.type] && file.size < 25e6) return file;
  let s, w, h;
  try { s = await createImageBitmap(file); w = s.width; h = s.height; }
  catch { s = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); w = s.naturalWidth; h = s.naturalHeight; }
  const k = Math.min(1, 4096 / Math.max(w, h));
  const c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
  c.getContext('2d').drawImage(s, 0, 0, c.width, c.height);
  return await new Promise(r => c.toBlob(r, 'image/jpeg', .9));
}
async function put(path, blob){
  const {error} = await sb.storage.from(BUCKET).upload(path, blob, {contentType: blob.type || 'application/octet-stream', upsert: false});
  if (error) throw error;
  return path;
}
async function submit(ev){
  ev.preventDefault();
  if (busy) return;
  const err = $('#err');
  if (!picked.length){ err.textContent = 'Ajoutez au moins une photo.'; return; }
  busy = true; err.textContent = ''; $('#send').disabled = true;
  const bar = $('#prog'); bar.hidden = false; const fill = bar.firstElementChild;
  const batch = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const paths = [];
  try {
    for (let i = 0; i < picked.length; i++){
      $('#send').textContent = `Envoi ${i + 1} / ${picked.length}…`;
      const blob = await prep(picked[i].file);
      paths.push(await put(`${me.id}/${batch}/${String(i + 1).padStart(3, '0')}.${OK[blob.type] || 'jpg'}`, blob));
      fill.style.width = `${Math.round((i + 1) / picked.length * 100)}%`;
    }
    const {error} = await sb.from('orders').insert({
      title: $('#title').value.trim().slice(0, 120) || 'Événement du ' + new Date().toLocaleDateString('fr-FR'),
      format: (document.querySelector('input[name=fmt]:checked') || {}).value || 'reel',
      note: $('#note').value.trim().slice(0, 1000),
      photos: paths
    });
    if (error) throw error;
    picked.forEach(p => URL.revokeObjectURL(p.url)); picked = [];
    $('#form').reset(); busy = false; closeSheet();
    if (!owner) tab = 'home';
    toast('Photos bien reçues. Votre vidéo arrive bientôt.');
    load();
  } catch (e){
    err.textContent = 'L\'envoi n\'a pas abouti. Réessayez.' + (e && e.message ? ` (détail : ${e.message})` : '');
    console.error(e);
  } finally {
    busy = false; $('#send').disabled = false; bar.hidden = true; fill.style.width = '0'; drawPicked();
  }
}

/* ---------- téléchargements ---------- */
async function getBlob(path){
  const {data, error} = await sb.storage.from(BUCKET).download(path);
  if (error) throw error;
  return data;
}
function saveBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60000);
}
async function saveVideo(btn){
  const path = btn.dataset.dl, name = btn.dataset.name;
  const blob = ready[path];
  if (blob){
    const file = new File([blob], name, {type: blob.type || 'video/mp4'});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      try { await navigator.share({files: [file]}); } catch (e){ if (e.name !== 'AbortError') saveBlob(blob, name); }
    } else saveBlob(blob, name);
    return;
  }
  btn.disabled = true; btn.textContent = 'Préparation…';
  try {
    const b = await getBlob(path);
    const file = new File([b], name, {type: b.type || 'video/mp4'});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      ready[path] = b; btn.disabled = false; btn.textContent = 'Enregistrer sur mon téléphone';
      toast('Vidéo prête : touchez « Enregistrer » puis « Enregistrer la vidéo ».');
    } else { saveBlob(b, name); btn.disabled = false; btn.textContent = 'Télécharger la vidéo'; }
  } catch { btn.disabled = false; btn.textContent = 'Télécharger la vidéo'; toast('Téléchargement impossible, réessayez.'); }
}
async function saveAll(id){
  const o = orders.find(x => x.id === id); if (!o) return;
  toast(`Téléchargement de ${o.photos.length} photo${o.photos.length > 1 ? 's' : ''}…`);
  for (let i = 0; i < o.photos.length; i++){
    try { saveBlob(await getBlob(o.photos[i]), `${slug(o.title)}-${String(i + 1).padStart(2, '0')}.${o.photos[i].split('.').pop()}`); }
    catch { toast('Une photo n\'a pas pu être téléchargée.'); }
    await new Promise(r => setTimeout(r, 350));
  }
}

/* ---------- studio ---------- */
async function update(id, data){
  const {error} = await sb.from('orders').update(data).eq('id', id);
  if (error){ toast('Mise à jour impossible, réessayez.'); return false; }
  load(); return true;
}
async function deliver(id, file){
  const o = orders.find(x => x.id === id); if (!o || !file) return;
  if (!/^video\//.test(file.type)){ toast('Choisissez un fichier vidéo.'); return; }
  toast(`Envoi de la vidéo (${(file.size / 1048576).toFixed(0)} Mo)…`);
  try {
    const ext = (file.name.split('.').pop() || 'mp4').toLowerCase().replace(/[^a-z0-9]/g, '') || 'mp4';
    const path = await put(`${o.client_id}/${o.id}/video-${Date.now()}.${ext}`, file);
    const old = o.video;
    if (await update(id, {status: 'livre', video: path, delivered_at: new Date().toISOString()})){
      if (old) sb.storage.from(BUCKET).remove([old]);
      toast('Vidéo livrée.');
    }
  } catch (e){
    console.error(e);
    toast(/size|large|exceed/i.test(e.message || '') ? 'Vidéo trop lourde pour la limite actuelle de Supabase.' : 'L\'envoi de la vidéo a échoué.');
  }
}
async function remove(btn){
  if (!btn.classList.contains('arm')){
    btn.classList.add('arm'); btn.textContent = 'Toucher encore pour supprimer définitivement';
    setTimeout(() => { if (btn.isConnected){ btn.classList.remove('arm'); btn.textContent = 'Supprimer la commande'; } }, 4000);
    return;
  }
  const o = orders.find(x => x.id === btn.dataset.del); if (!o) return;
  btn.disabled = true; btn.textContent = 'Suppression…';
  const files = [...(o.photos || []), o.video].filter(Boolean);
  if (files.length) await sb.storage.from(BUCKET).remove(files);
  const {error} = await sb.from('orders').delete().eq('id', o.id);
  if (error){ toast('Suppression impossible, réessayez.'); btn.disabled = false; return; }
  toast('Commande supprimée.'); load();
}

/* ---------- événements ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-close]'); if (!t) return;
  if (t.dataset.tab){ tab = t.dataset.tab; render(); window.scrollTo({top: 0}); }
  else if ('new' in t.dataset) openSheet();
  else if ('close' in t.dataset) closeSheet();
  else if (t.dataset.rm){ const p = picked.splice(+t.dataset.rm, 1)[0]; if (p) URL.revokeObjectURL(p.url); drawPicked(); }
  else if (t.dataset.dl) saveVideo(t);
  else if (t.dataset.dlall) saveAll(t.dataset.dlall);
  else if (t.dataset.start) update(t.dataset.start, {status: 'prod'});
  else if (t.dataset.del && owner) remove(t);
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'photos'){ for (const f of t.files) picked.push({file: f, url: URL.createObjectURL(f)}); t.value = ''; drawPicked(); }
  else if (t.dataset && t.dataset.vid && owner){ deliver(t.dataset.vid, t.files[0]); t.value = ''; }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
$('#form').addEventListener('submit', submit);

/* ---------- démarrage ---------- */
function boot(showGate){
  $('#gate').hidden = !showGate;
  const s = $('#splash'); s.classList.add('off'); setTimeout(() => s.remove(), 300);
}
if (!sb) boot(true);
else {
  sb.auth.getSession().then(async ({data}) => {
    if (data && data.session){ await enter(data.session); boot(false); }
    else boot(true);
  }).catch(() => boot(true));
  sb.auth.onAuthStateChange((ev) => { if (ev === 'SIGNED_OUT' && me) leave(); });
}
}
</script>
